name: Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Test, build, and publish release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Verify tag matches package version
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          package_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag_version != package_version:
              raise SystemExit(f"Release tag {tag_version!r} does not match package version {package_version!r}")

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run release checks
        run: |
          uv run ruff check src tests
          uv run pytest -q

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify distribution identity
        shell: python
        run: |
          import email.parser
          import pathlib
          import tomllib
          import zipfile

          expected_name = "pydantic-ai-rlm-monty"
          expected_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          filename_stem = f"pydantic_ai_rlm_monty-{expected_version}"
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          sdists = list(pathlib.Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or wheels[0].name != f"{filename_stem}-py3-none-any.whl":
              raise SystemExit(f"Unexpected wheel output: {wheels}")
          if len(sdists) != 1 or sdists[0].name != f"{filename_stem}.tar.gz":
              raise SystemExit(f"Unexpected source distribution output: {sdists}")
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_paths = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_paths) != 1:
                  raise SystemExit(f"Unexpected wheel metadata entries: {metadata_paths}")
              metadata = email.parser.BytesParser().parsebytes(archive.read(metadata_paths[0]))
          if metadata["Name"] != expected_name or metadata["Version"] != expected_version:
              raise SystemExit(
                  f"Unexpected distribution metadata: Name={metadata['Name']!r}, Version={metadata['Version']!r}"
              )

      - name: Generate SHA-256 checksums
        run: sha256sum dist/* > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            SHA256SUMS \
            --verify-tag \
            --title "pydantic-ai-rlm-monty ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
