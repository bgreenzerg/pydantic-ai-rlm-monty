name: Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Test, build, and publish release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify tag matches package version
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          package_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag_version != package_version:
              raise SystemExit(f"Release tag {tag_version!r} does not match package version {package_version!r}")

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run release checks
        run: |
          uv run ruff check src tests
          uv run pytest -q

      - name: Build wheel and source distribution
        run: uv build

      - name: Generate SHA-256 checksums
        run: sha256sum dist/* > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            SHA256SUMS \
            --verify-tag \
            --title "pydantic-ai-rlm ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
